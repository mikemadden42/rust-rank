[project]
name = "rust-rank"
version = "0.1.0"
description = "Rank rust projects by download"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "pandas>=2.3.3",
    "requests>=2.32.5",
]

[tool.poetry.dependencies]
beautifulsoup4 = "^4.10.0"
pandas = "^2.0.0"
requests = "^2.27.1"

[tool.ruff]
lint.select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # Pylint
    "PL"
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]
